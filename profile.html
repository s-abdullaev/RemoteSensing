</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Бош саҳифа</a></li>

                <li><a href="login.html">Кириш / Рўйхатдан ўтиш</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="page-title">Фойдаланувчи Профили</h1>
        <div class="form-container" style="max-width: 600px;">
            <h2>Шахсий Маълумотлар</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="profile-fullname">Ф.И.Ш.:</label>
                    <input type="text" id="profile-fullname" name="profile-fullname" value="Алимов Валижон" readonly>
                </div>
                <div class="form-group">
                    <label for="profile-email">Электрон почта:</label>
                    <input type="email" id="profile-email" name="profile-email" value="ali@example.com" readonly>
                </div>
                <div class="form-group">
                    <label for="profile-organization">Ташкилот:</label>
                    <input type="text" id="profile-organization" name="profile-organization" value="Ўрмон Хўжалиги Агентлиги">
                </div>
                <div class="form-group">
                    <label for="profile-phone">Телефон рақам:</label>
                    <input type="text" id="profile-phone" name="profile-phone" value="+998901234567">
                </div>
                <div class="form-group">
                    <button type="submit">Маълумотларни Сақлаш</button>
                </div>
            </form>
        </div>

        <div class="form-container" style="max-width: 600px; margin-top:30px;">
            <h2>Паролни Ўзгартириш</h2>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label for="current-password">Жорий парол:</label>
                    <input type="password" id="current-password" name="current-password" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Янги парол:</label>
                    <input type="password" id="new-password" name="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-new-password">Янги паролни тасдиқланг:</label>
                    <input type="password" id="confirm-new-password" name="confirm-new-password" required>
                </div>
                <div class="form-group">
                    <button type="submit">Паролни Ўзгартириш</button>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Масофавий Зондлаш Тизими</p>

    <script src="js/main.js"></script>

</html>
