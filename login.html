            </ul>
        </nav>
    </header>
    <main>
        <div class="form-container">
            <h2>Кириш</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login-email">Электрон почта:</label>
                    <input type="email" id="login-email" name="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Парол:</label>
                    <input type="password" id="login-password" name="login-password" required>
                </div>
                <div class="form-group">
                    <button type="submit">Кириш</button>
                </div>
            </form>
        </div>

        <div class="form-container">
            <h2>Рўйхатдан ўтиш</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="register-fullname">Ф.И.Ш.:</label>
                    <input type="text" id="register-fullname" name="register-fullname" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Электрон почта:</label>
                    <input type="email" id="register-email" name="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Парол:</label>
                    <input type="password" id="register-password" name="register-password" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">Паролни тасдиқланг:</label>
                    <input type="password" id="register-confirm-password" name="register-confirm-password" required>
                </div>
                <div class="form-group">
                    <button type="submit">Рўйхатдан ўтиш</button>
                </div>
            </form>
        </div>
    </main>
