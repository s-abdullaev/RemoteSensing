<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таҳлил Панели</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Бош саҳифа</a></li>
                <li><a href="map.html">Асосий Харита</a></li>
                <li><a href="analysis.html">Таҳлил Панели</a></li>
                <li><a href="data.html">Маълумотлар</a></li>
                <li><a href="visualization.html">Визуализация</a></li>
                <li><a href="reports.html">Ҳисоботлар</a></li>
                <li><a href="profile.html">Профил</a></li>
                <li><a href="admin.html">Админ Панели</a></li>
                <li><a href="login.html">Кириш / Рўйхатдан ўтиш</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="page-title">Таҳлил Панели</h1>
        <div class="form-container" style="max-width: 800px;">
            <h2>Таҳлил Параметрлари</h2>
            <form id="analysisForm">
                <div class="form-group">
                    <label for="region">Минтақани танланг:</label>
                    <select id="region" name="region">
                        <option value="tashkent">Тошкент вилояти</option>
                        <option value="samarkand">Самарқанд вилояти</option>
                        <option value="bukhara">Бухоро вилояти</option>
                        <!-- More regions -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="analysis-type">Таҳлил тури:</label>
                    <select id="analysis-type" name="analysis-type">
                        <option value="ndvi">NDVI (Ўсимликлар индекси)</option>
                        <option value="water_detection">Сув сатҳини аниқлаш</option>
                        <option value="land_cover">Ер қоплами таснифи</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date-range">Сана оралиғи:</label>
                    <input type="text" id="date-range" name="date-range" placeholder="Бошланиш санаси - Тугаш санаси">
                </div>
                <div class="form-group">
                    <button type="submit">Таҳлилни бошлаш</button>
                </div>
            </form>
        </div>

        <div id="chart-container">
            <canvas id="analysisChart"></canvas>
            <p>Диаграмма юкланмоқда...</p>
        </div>
        <p style="text-align:center; margin-top: 10px;">Бу ерда таҳлил натижалари диаграммаси кўрсатилади.</p>

    </main>
    <footer>
        <p>&copy; 2024 Масофавий Зондлаш Тизими</p>
    </footer>
    <script src="js/main.js"></script>
    <script src="js/charts.js"></script>
</body>
</html>
